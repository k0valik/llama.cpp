name: Stack upstream sync

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: stack-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SYNC_REPORT: ${{ runner.temp }}/stack-upstream-sync-report.md
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: true
          submodules: false

      - name: Prepare candidate
        run: |
          # git switch/merge changes the worktree: never execute the resulting script.
          cp scripts/stack-upstream-sync.sh "$RUNNER_TEMP/stack-upstream-sync.sh"
          bash "$RUNNER_TEMP/stack-upstream-sync.sh"

      - name: Publish report to rolling PR
        if: always()
        shell: bash
        run: |
          if [ ! -f "$SYNC_REPORT" ]; then
            printf '# Rolling upstream synchronization\n\nThe run failed before producing a report; inspect the workflow logs. No successful synchronization is claimed.\n' > "$SYNC_REPORT"
          fi
          cat "$SYNC_REPORT" >> "$GITHUB_STEP_SUMMARY"
          number=$(gh pr list --state open --base port/qwen3.8-27b-cuda-v0.9.0 --head sync/upstream-v090 --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --body-file "$SYNC_REPORT"
          else
            gh pr create --draft --base port/qwen3.8-27b-cuda-v0.9.0 --head sync/upstream-v090 --title 'Rolling upstream integration (review required)' --body-file "$SYNC_REPORT"
          fi
